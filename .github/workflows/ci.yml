name: CI

# Pull requests only: the squash merge puts the tree its pull request tested on main.
on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'NOTICE'
      - 'AGENTS.md'
      - 'docs/**'
      - 'release/NOTES.md'
      - '.github/workflows/release.yml'
      - '.github/workflows/cleanup.yml'
  workflow_dispatch:

jobs:
  # A pull request can read only main's Gradle cache, which the caches job in release.yml fills.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: The release's name is its own
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/check-name.sh
      - name: Lint
        run: scripts/check.sh lint

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Unit and screenshot tests
        run: scripts/check.sh tests
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: failure()
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/outputs/roborazzi/

  budgets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Budgets (permissions, dependencies, APK size)
        run: scripts/check.sh budgets

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Debug APK
        run: scripts/check.sh apk
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: amsel-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  live-server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with the servers scripts/check.sh runs by default.
        server: ['2.10.9', '2.11.0b7']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Live tests on Music Assistant ${{ matrix.server }} (client, seeks on a speaker, first-run journey)
        run: scripts/check.sh live:${{ matrix.server }}
